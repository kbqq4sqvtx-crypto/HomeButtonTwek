name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils

      - name: Setup Theos and SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz
          mkdir -p $THEOS/sdks
          tar -xf sdk.tar.xz -C $THEOS/sdks
          # Установка ldid (нужен для подписи на Linux)
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid
          sudo mv ldid /usr/local/bin/

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Upload Deb File
        uses: actions/upload-artifact@v4
        with:
          name: HomeButton-Deb
          path: packages/*.deb
