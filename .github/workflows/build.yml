name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1

      - name: Upload Deb File
        uses: actions/upload-artifact@v3
        with:
          name: HomeButton-Deb
          path: packages/*.deb
